<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#173c2d" />
  <title>멸종위기동물 보금자리 카메라 놀이</title>
  <link rel="stylesheet" href="startscreen-20260818.css?v=20260819-newvideos" />
</head>
<body>
  <main id="app">
    <video id="camera" muted playsinline webkit-playsinline></video>

    <section id="start-screen" aria-live="polite">
      <div class="start-card">
        <div class="leaf-mark">🌿</div>
        <p class="eyebrow">보금자리 카메라 놀이</p>
        <h1>동물 친구가 살 보금자리를<br>카메라로 비춰 보세요</h1>
        <p class="intro">먼저 이 화면이 보여야 정상입니다.<br>새 영상이 적용된 버전입니다.<br>아래 버튼을 눌렀을 때만 카메라가 켜져요.</p>
        <button id="start-button" type="button">카메라 시작하기</button>
        <p class="tiny">Chrome에서 열고 카메라 권한을 허용해 주세요.</p>
      </div>
    </section>

    <header id="topbar" class="hidden">
      <div class="title">멸종위기동물 보금자리 관찰</div>
      <button id="fit-toggle" type="button">전체보기</button>
    </header>

    <section id="controls" class="hidden">
      <div class="animal-row" role="group" aria-label="동물 선택">
        <button class="animal-btn selected" type="button" data-animal="bear">반달가슴곰</button>
        <button class="animal-btn" type="button" data-animal="deer">노루</button>
        <button class="animal-btn" type="button" data-animal="otter">수달</button>
      </div>
      <div class="mode-row" role="group" aria-label="표시 방식">
        <button class="mode-btn selected" type="button" data-mode="image">사진 모드</button>
        <button class="mode-btn" type="button" data-mode="video">영상 모드</button>
        <button id="center-button" type="button">가운데 띄우기</button>
      </div>
    </section>

    <div id="stage" class="hidden" aria-label="동물 표시 영역">
      <img id="animal-image" alt="선택한 동물" draggable="false" />
      <video id="animal-video" muted loop playsinline webkit-playsinline></video>
    </div>

    <section id="bottom-guide" class="hidden">
      <p id="message">동물을 선택한 뒤, 아이들이 만든 보금자리 위치를 화면에서 터치하세요.</p>
      <div class="size-row">
        <button id="smaller" type="button">작게</button>
        <button id="bigger" type="button">크게</button>
        <button id="hide-animal" type="button">숨기기</button>
      </div>
    </section>
  </main>
  <script src="startscreen-20260818.js?v=20260819-newvideos"></script>
</body>
</html>
